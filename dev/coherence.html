<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MediaPipe tasks-vision posts usage logs to Google; nothing may leave for Google, so block it. -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data: ws:" />
    <title>coherence · 奶蛙</title>
    <style>
      html, body { margin: 0; background: #16181d; color: #e8e6e1; font: 13px/1.45 system-ui, sans-serif; }
      main { padding: 12px 16px; display: grid; grid-template-columns: 340px 1fr; gap: 14px; }
      #status { padding: 4px 8px; border-radius: 6px; background: #000a; display: inline-block; margin-bottom: 8px; }
      #previews { display: grid; gap: 8px; }
      #previews > div { position: relative; width: 320px; height: 240px; background: #000; border-radius: 8px; overflow: hidden; }
      #previews .label { position: absolute; left: 6px; top: 4px; z-index: 2; background: #000a; padding: 1px 6px; border-radius: 4px; }
      canvas.plot { width: 100%; height: 170px; background: #1d2027; border-radius: 8px; display: block; margin-bottom: 8px; }
      table { border-collapse: collapse; margin: 6px 0 12px; }
      td, th { padding: 2px 8px; border-bottom: 1px solid #2c3039; text-align: right; }
      td:first-child, th:first-child { text-align: left; }
      h3 { margin: 10px 0 4px; font-size: 13px; color: #ffd34d; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div id="status">…</div>
        <div id="previews">
          <div id="film"><span class="label">filmed (virtual camera)</span></div>
          <div id="preview"><span class="label">analysis</span></div>
        </div>
      </div>
      <div id="out"></div>
    </main>
    <script type="module" src="./coherence.ts"></script>
  </body>
</html>
