<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>gpu sim · 奶蛙 dev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfe3e6;
        font: 12px/1.4 system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        left: 8px;
        top: 8px;
        width: 250px;
        max-height: calc(100% - 16px);
        overflow: auto;
        background: rgba(255, 255, 255, 0.86);
        border-radius: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      #panel label {
        display: grid;
        grid-template-columns: 84px 1fr 36px;
        align-items: center;
        gap: 4px;
      }
      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }
      #panel button,
      #panel select {
        font: inherit;
      }
      #stats {
        position: fixed;
        right: 8px;
        top: 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 6px 8px;
        border-radius: 6px;
        white-space: pre;
        font: 11px/1.35 ui-monospace, monospace;
        max-width: 46%;
      }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="./gpu.ts"></script>
  </body>
</html>
