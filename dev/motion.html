<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MediaPipe tasks-vision posts usage logs to Google; nothing may leave for Google, so block it. -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data: ws:" />
    <title>motion · 奶蛙</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16181d; color: #e8e6e1; font: 13px/1.4 system-ui, sans-serif; }
      #view { position: fixed; inset: 0 0 44px 0; width: 100%; height: calc(100% - 44px); display: block; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 6px; align-items: center; padding: 0 8px; background: #22252c; overflow-x: auto; }
      #bar button, #bar label { background: #343844; color: inherit; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
      #status { position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px; background: #000a; }
      #preview { position: fixed; right: 12px; bottom: 56px; width: 240px; height: 320px; border-radius: 12px; overflow: hidden; background: #000; }
      #preview:empty { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">idle</div>
    <div id="preview"></div>
    <div id="bar">
      <span id="dances" style="display: flex; gap: 6px"></span>
      <button id="camera">摄像头</button>
      <label>视频 <input id="file" type="file" accept="video/*" hidden /></label>
      <label><input id="mirror" type="checkbox" /> 镜像</label>
      <button id="stop">停</button>
    </div>
    <script type="module" src="/src/motion/devPage.ts"></script>
  </body>
</html>
