<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Only in this dev copy: resolve the relative paths as index.html at the site root does. -->
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Naiwa Motion Lab</title>
    <!-- Descriptions: zh "戳它、捏它、抛起它，再带它跳舞：一只软体 + 骨骼的奶蛙，录下来分享。"
                       en "Poke, squish and throw a soft-body Naiwa, make it dance with your camera or a video, and share the clip."
         index.html carries one statically (the default language); the same pair goes into og:description. -->
    <meta name="description" content="戳它、捏它、抛起它，再带它跳舞：一只软体 + 骨骼的奶蛙，录下来分享。" />
    <!-- Media's head tags for index.html (paths relative: the site is built with base "./"). -->
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f8c63c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Naiwa Lab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Naiwa Motion Lab" />
    <meta property="og:title" content="Naiwa Motion Lab · 奶蛙" />
    <meta property="og:description" content="戳它、捏它、抛起它，再带它跳舞：一只软体 + 骨骼的奶蛙，录下来分享。" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:image" content="https://SITE/icons/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="黄色的奶蛙捧着肚子吐舌头大笑 / The yellow Naiwa holding its belly, laughing with its tongue out" />
    <meta property="og:url" content="https://SITE/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://SITE/icons/og.png" />
  </head>
  <body>
    <!-- WeChat ignores og:*; without its JS-SDK some versions take the first large image in the body as the
         link thumbnail, hence this hidden one. -->
    <div style="display: none"><img src="./icons/icon-512.png" alt="" /></div>
    <p>media head tags check: <img src="./icons/favicon.svg" width="32" /> <img src="./icons/icon-192.png" width="64" /></p>
  </body>
</html>
