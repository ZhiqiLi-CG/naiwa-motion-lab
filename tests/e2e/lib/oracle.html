<!doctype html>
<html>
  <head><meta charset="UTF-8" /><title>e2e pose oracle</title></head>
  <body>
    <script type="module">
      // The person's pose in a test clip, frame by frame, with the app's own self-hosted MediaPipe files: the ground
      // truth the frog's motion is compared with. The frames are images ffmpeg extracted (lib/follow.mjs), each
      // detected on its own (IMAGE mode): playing the video and tracking (VIDEO mode) depends on how many frames the
      // browser gets to present, and on a busy machine the result lagged the person by seconds.
      import { FilesetResolver, PoseLandmarker } from "/__e2e/vision_bundle.mjs";
      window.__oracle = async (frameUrls, times, model) => {
        const fileset = await FilesetResolver.forVisionTasks("/__e2e/mediapipe/wasm");
        const lm = await PoseLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: `/__e2e/mediapipe/${model}`, delegate: "GPU" },
          runningMode: "IMAGE",
          numPoses: 1,
        });
        const frames = [];
        let width = 0, height = 0;
        for (let i = 0; i < frameUrls.length; i++) {
          const img = new Image();
          img.src = frameUrls[i];
          await img.decode();
          width = img.naturalWidth;
          height = img.naturalHeight;
          const res = lm.detect(img);
          const w = res.worldLandmarks[0], im = res.landmarks[0];
          // image: normalised x, y in the video's own (unmirrored) frame, to tell which screen side a hand is on
          frames.push({ t: times[i], world: w ? w.map((p) => [p.x, p.y, p.z, p.visibility ?? 1]) : null, image: im ? im.map((p) => [p.x, p.y]) : null });
        }
        lm.close();
        return { width, height, frames };
      };
    </script>
  </body>
</html>
